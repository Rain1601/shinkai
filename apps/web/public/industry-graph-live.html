<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8" />
<title>Shinkai · Industry Graph · Live</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<script src="https://unpkg.com/cytoscape@3.28.1/dist/cytoscape.min.js"></script>
<style>
  :root {
    --bg: #0b0d12;
    --panel: #11141b;
    --line: #1d222c;
    --text: #e7ebf0;
    --muted: #8c95a3;
    --accent: #6fa8ff;
    --accent-2: #ff9d6c;
    --warn: #ffb454;
    --ok: #7ed957;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: ui-sans-serif, system-ui, -apple-system, "Helvetica Neue", sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
    display: grid;
    grid-template-columns: 320px 1fr 360px;
    grid-template-rows: 48px 1fr;
  }
  header {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
  }
  header h1 {
    margin: 0;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.5px;
  }
  header .live-tag {
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 4px;
    background: var(--accent);
    color: #0b0d12;
    font-weight: 700;
    letter-spacing: 0.4px;
  }
  header .meta {
    font-size: 11px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  aside.left, aside.right {
    background: var(--panel);
    border-right: 1px solid var(--line);
    overflow-y: auto;
    font-size: 12px;
  }
  aside.right { border-right: none; border-left: 1px solid var(--line); }
  aside h2 {
    font-size: 11px;
    text-transform: uppercase;
    color: var(--muted);
    letter-spacing: 1px;
    margin: 16px 16px 8px;
    font-weight: 600;
  }
  .row {
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding: 8px 16px;
    border-bottom: 1px solid var(--line);
  }
  .row label {
    font-size: 10px;
    text-transform: uppercase;
    color: var(--muted);
    letter-spacing: 0.7px;
  }
  .row select, .row input {
    background: #161a22;
    border: 1px solid var(--line);
    color: var(--text);
    padding: 6px 8px;
    border-radius: 4px;
    font-family: inherit;
    font-size: 12px;
  }
  .row .stat {
    display: flex;
    justify-content: space-between;
    font-variant-numeric: tabular-nums;
  }
  .row .stat span:first-child { color: var(--muted); }
  #cy {
    width: 100%;
    height: 100%;
    background: radial-gradient(ellipse at center, #131722 0%, #0b0d12 80%);
  }
  .empty-cy {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 8px;
    color: var(--muted);
    font-size: 13px;
    text-align: center;
    padding: 32px;
  }
  .empty-cy code {
    background: var(--panel);
    border: 1px solid var(--line);
    padding: 6px 10px;
    border-radius: 4px;
    color: var(--accent);
    font-size: 11px;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 4px 16px;
    font-size: 11px;
  }
  .legend-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
  }
  .detail-card {
    padding: 12px 16px;
    border-bottom: 1px solid var(--line);
  }
  .detail-card h3 {
    margin: 0 0 4px;
    font-size: 14px;
    font-weight: 600;
  }
  .detail-card .kind-tag {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    background: var(--line);
    padding: 2px 6px;
    border-radius: 3px;
    color: var(--muted);
  }
  .detail-card .desc {
    margin: 8px 0;
    color: var(--muted);
    line-height: 1.5;
    font-size: 11.5px;
  }
  .detail-card dl {
    margin: 8px 0 0;
    display: grid;
    grid-template-columns: 80px 1fr;
    gap: 4px 8px;
    font-size: 11px;
  }
  .detail-card dt { color: var(--muted); }
  .detail-card dd { margin: 0; word-break: break-word; }
  .err {
    color: var(--accent-2);
    padding: 8px 16px;
    background: rgba(255,157,108,0.08);
    border-left: 3px solid var(--accent-2);
  }
</style>
</head>
<body>
<header>
  <div style="display:flex;align-items:center;gap:10px;">
    <h1>shinkai · industry graph</h1>
    <span class="live-tag" id="live-tag">LIVE</span>
  </div>
  <div class="meta" id="meta-line">connecting…</div>
</header>

<aside class="left">
  <h2>filter</h2>
  <div class="row">
    <label>kind</label>
    <select id="kind-filter">
      <option value="">all</option>
      <option value="Company" selected>Company</option>
      <option value="SubTheme">SubTheme</option>
      <option value="Product">Product</option>
      <option value="Component">Component</option>
      <option value="Bottleneck">Bottleneck</option>
      <option value="KeyDataPoint">KeyDataPoint</option>
      <option value="InvestmentThesis">InvestmentThesis</option>
      <option value="Source">Source</option>
    </select>
  </div>
  <div class="row">
    <label>limit (node count)</label>
    <input type="number" id="limit-input" value="300" min="10" max="2000" step="10" />
  </div>

  <h2>stats</h2>
  <div class="row">
    <div class="stat"><span>visible nodes</span><span id="stat-nodes">—</span></div>
    <div class="stat"><span>visible edges</span><span id="stat-edges">—</span></div>
    <div class="stat"><span>store total entities</span><span id="stat-total-e">—</span></div>
    <div class="stat"><span>store total relations</span><span id="stat-total-r">—</span></div>
    <div class="stat"><span>snapshot</span><span id="stat-snap">—</span></div>
  </div>

  <h2>legend (kind)</h2>
  <div id="legend"></div>
</aside>

<div id="cy-wrap">
  <div id="cy"></div>
</div>

<aside class="right" id="detail-pane">
  <h2>selection</h2>
  <div class="detail-card" id="empty-detail" style="color:var(--muted);">
    Click a node or edge to inspect.
  </div>
</aside>

<script>
  const API_BASE = (function () {
    if (typeof window.SHINKAI_API_BASE === 'string') return window.SHINKAI_API_BASE;
    const meta = document.querySelector('meta[name=api-base]');
    if (meta) return meta.content;
    // dev fallback — same logic as scripts/dev.sh
    if (location.port === '3100') return 'http://localhost:8100';
    if (location.port === '3120') return 'http://localhost:8120';
    return location.origin;
  })();

  // Kind → color (consistent visual mapping)
  const KIND_COLORS = {
    Company: '#6fa8ff',
    SubTheme: '#ff9d6c',
    Product: '#7ed957',
    Component: '#c98bff',
    Bottleneck: '#ff6b6b',
    KeyDataPoint: '#ffd166',
    InvestmentThesis: '#5be0c6',
    Source: '#778294',
    Entity: '#aaa',
  };

  const $ = (id) => document.getElementById(id);

  function pickLayout() {
    return {
      name: 'cose',
      animate: false,
      idealEdgeLength: 80,
      nodeRepulsion: 400000,
      gravity: 0.4,
      numIter: 1500,
    };
  }

  function renderLegend() {
    const root = $('legend');
    root.innerHTML = '';
    Object.entries(KIND_COLORS).forEach(([k, color]) => {
      const row = document.createElement('div');
      row.className = 'legend-item';
      row.innerHTML = `<span class="legend-dot" style="background:${color}"></span>${k}`;
      root.appendChild(row);
    });
  }

  async function fetchStats() {
    try {
      const r = await fetch(`${API_BASE}/api/v1/industry_graph/stats`);
      if (!r.ok) throw new Error(`stats ${r.status}`);
      const s = await r.json();
      $('stat-total-e').textContent = s.entities;
      $('stat-total-r').textContent = s.relations;
      $('stat-snap').textContent = `v${s.snapshot_version}`;
      $('meta-line').textContent = `${s.entities} entities · ${s.relations} relations · ${s.kinds} kinds · ${s.tickers} tickers`;
    } catch (e) {
      $('meta-line').textContent = `API unreachable @ ${API_BASE}`;
      $('live-tag').style.background = 'var(--accent-2)';
      $('live-tag').textContent = 'OFFLINE';
      throw e;
    }
  }

  async function fetchExport() {
    const params = new URLSearchParams();
    const k = $('kind-filter').value;
    if (k) params.set('kind', k);
    const limit = $('limit-input').value;
    if (limit) params.set('limit', limit);
    const r = await fetch(`${API_BASE}/api/v1/industry_graph/export?${params}`);
    if (!r.ok) throw new Error(`export ${r.status}`);
    return r.json();
  }

  function renderGraph(payload) {
    $('stat-nodes').textContent = payload.meta.node_count;
    $('stat-edges').textContent = payload.meta.edge_count;
    const wrap = $('cy-wrap');
    wrap.innerHTML = '<div id="cy"></div>';
    if (payload.nodes.length === 0) {
      $('cy').outerHTML = `
        <div class="empty-cy">
          <div>Store has 0 entities matching the filter.</div>
          <div>Seed it with:</div>
          <code>uv run python scripts/ingest_supply_chain_graph_seed.py &lt;path-to-seed.json&gt;</code>
        </div>`;
      return;
    }

    const cyNodes = payload.nodes.map((n) => ({
      data: {
        id: n.id,
        label: n.label,
        kind: n.kind,
        layer: n.layer || '',
        desc: n.desc,
        color: KIND_COLORS[n.kind] || KIND_COLORS.Entity,
        raw: n,
      },
    }));
    const cyEdges = payload.edges.map((e) => ({
      data: {
        id: e.id,
        source: e.source,
        target: e.target,
        type: e.type,
        raw: e,
      },
    }));

    const cy = cytoscape({
      container: $('cy'),
      elements: { nodes: cyNodes, edges: cyEdges },
      style: [
        {
          selector: 'node',
          style: {
            'background-color': 'data(color)',
            label: 'data(label)',
            'font-size': 9,
            'font-family': 'ui-sans-serif, sans-serif',
            color: '#e7ebf0',
            'text-outline-color': '#0b0d12',
            'text-outline-width': 2,
            'text-valign': 'bottom',
            'text-margin-y': 4,
            width: 18,
            height: 18,
            'border-width': 1,
            'border-color': 'rgba(255,255,255,0.2)',
          },
        },
        {
          selector: 'node[kind = "SubTheme"]',
          style: { width: 28, height: 28, 'font-weight': 'bold' },
        },
        {
          selector: 'node[kind = "Bottleneck"]',
          style: { shape: 'diamond', width: 22, height: 22 },
        },
        {
          selector: 'edge',
          style: {
            width: 0.7,
            'line-color': 'rgba(120,140,170,0.35)',
            'curve-style': 'bezier',
            'target-arrow-shape': 'triangle',
            'target-arrow-color': 'rgba(120,140,170,0.5)',
            'arrow-scale': 0.7,
          },
        },
        {
          selector: 'edge[type = "competes_with"]',
          style: { 'line-color': 'rgba(255,107,107,0.45)', 'line-style': 'dashed' },
        },
        {
          selector: 'edge[type = "themed_under"]',
          style: { 'line-color': 'rgba(255,157,108,0.35)' },
        },
        {
          selector: '.selected',
          style: {
            'border-width': 3,
            'border-color': '#ffd166',
            width: 26,
            height: 26,
          },
        },
        {
          selector: 'edge.selected',
          style: {
            width: 2.4,
            'line-color': '#ffd166',
            'target-arrow-color': '#ffd166',
          },
        },
      ],
      layout: pickLayout(),
    });

    cy.on('tap', (evt) => {
      cy.elements().removeClass('selected');
      if (evt.target === cy) {
        showEmptyDetail();
        return;
      }
      evt.target.addClass('selected');
      const raw = evt.target.data('raw');
      if (evt.target.isNode()) renderNodeDetail(raw);
      else renderEdgeDetail(raw);
    });
  }

  function showEmptyDetail() {
    $('detail-pane').innerHTML = `<h2>selection</h2>
      <div class="detail-card" style="color:var(--muted);">Click a node or edge to inspect.</div>`;
  }

  function renderNodeDetail(n) {
    const aliases = (n.aliases || []).join(', ');
    const facets = Object.entries(n.facets || {})
      .map(([k, v]) => `<dt>${k}</dt><dd>${escape(JSON.stringify(v))}</dd>`)
      .join('');
    const attrs = Object.entries(n.attributes || {})
      .filter(([k]) => k !== 'role')
      .slice(0, 12)
      .map(([k, v]) => `<dt>${k}</dt><dd>${escape(typeof v === 'string' ? v : JSON.stringify(v))}</dd>`)
      .join('');
    $('detail-pane').innerHTML = `
      <h2>node</h2>
      <div class="detail-card">
        <span class="kind-tag">${n.kind}</span>
        <h3>${escape(n.label)}</h3>
        <div class="desc">${escape(n.desc || '—')}</div>
        <dl>
          <dt>id</dt><dd>${escape(n.id)}</dd>
          ${n.layer ? `<dt>layer</dt><dd>${escape(n.layer)}</dd>` : ''}
          ${aliases ? `<dt>aliases</dt><dd>${escape(aliases)}</dd>` : ''}
          ${n.confidence != null ? `<dt>confidence</dt><dd>${n.confidence}</dd>` : ''}
          ${n.source ? `<dt>source</dt><dd>${escape(n.source)}</dd>` : ''}
          ${facets}
          ${attrs}
        </dl>
      </div>`;
  }

  function renderEdgeDetail(e) {
    const wbpRows = Object.entries(e.wbp || {})
      .sort()
      .map(([period, vals]) => {
        const [share, delta, conf] = vals;
        return `<dt>${period}</dt><dd>share=${share}, Δ=${delta}, conf=${conf}</dd>`;
      })
      .join('');
    $('detail-pane').innerHTML = `
      <h2>edge</h2>
      <div class="detail-card">
        <span class="kind-tag">${e.type}</span>
        <h3>${escape(e.source)} → ${escape(e.target)}</h3>
        <dl>
          <dt>id</dt><dd>${escape(e.id)}</dd>
          ${e.confidence != null ? `<dt>confidence</dt><dd>${e.confidence}</dd>` : ''}
          ${e.evidence_type ? `<dt>evidence</dt><dd>${escape(e.evidence_type)}</dd>` : ''}
          ${e.evidence_ref ? `<dt>source</dt><dd>${escape(e.evidence_ref)}</dd>` : ''}
          ${wbpRows}
        </dl>
      </div>`;
  }

  function escape(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  async function refresh() {
    try {
      await fetchStats();
      const data = await fetchExport();
      renderGraph(data);
    } catch (e) {
      const w = $('cy-wrap');
      w.innerHTML = `<div class="err">Could not load graph: ${escape(e.message)}<br>API base: ${API_BASE}</div>`;
    }
  }

  renderLegend();
  showEmptyDetail();
  $('kind-filter').addEventListener('change', refresh);
  $('limit-input').addEventListener('change', refresh);
  refresh();
</script>
</body>
</html>
