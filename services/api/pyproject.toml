[project]
name = "shinkai-api"
version = "1.0.0"
description = "Shinkai API and long-running agent harness"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.5.0",
  "psycopg[binary]>=3.2.0",
  "uvicorn[standard]>=0.30.0",
  "yfinance>=1.4.1",
  "pyjwt>=2.13.0",
  "market-utils[google,tavily]",
]

# market-utils is consumed from a private GitHub repo. Auth on dev
# machines goes through the existing gh-CLI HTTPS credential helper; on
# CI/servers, set GITHUB_TOKEN with repo:read scope, or swap to the SSH
# form: { git = "ssh://git@github.com/Rain1601/market-utils.git", rev = "main" }
[tool.uv.sources]
market-utils = { git = "https://github.com/Rain1601/market-utils.git", rev = "main" }

[dependency-groups]
dev = [
  "ruff>=0.6.0",
  "pytest>=8.3.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shinkai_api"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
